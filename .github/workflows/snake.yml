name: Snake

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ffdd00&color_dots=#f0ebe9,#4d0a00,#aa2200,#ff6600,#ffdd00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffdd00&color_dots=#161b22,#4d0a00,#aa2200,#ff6600,#ffdd00

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
