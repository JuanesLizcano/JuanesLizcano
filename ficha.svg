<svg xmlns="http://www.w3.org/2000/svg" width="452" height="407" viewBox="0 0 452 407" role="img" aria-label="Ficha: qué hago, con qué, y desde dónde">
  <title>juanes@github ~ $ neofetch</title>

  <!--
    Ficha estilo neofetch, escrita a mano. Cada linea entra con su propio
    retardo y se queda (fill/forwards): se lee como si se estuviera imprimiendo,
    y despues queda quieta en vez de repetirse en bucle.

    Alto 407 = el mismo que retrato.svg, para que las dos tarjetas queden
    alineadas cuando van lado a lado en la tabla del README.
    Ancho 452 + 396 del retrato + 12 de aire = 860.

    Sin fuentes externas ni servicios de terceros: GitHub sirve esto por su
    proxy y no carga nada de fuera.
  -->

  <defs>
    <linearGradient id="oro2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#D6D6DE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="brasa2" cx="88%" cy="90%" r="62%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D6D6DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .k    { fill: #D6D6DE; font-size: 11.5px; }
    .v    { fill: #C9C9D1; font-size: 11.5px; }
    .t    { fill: #6E6E7A; font-size: 11px; }
    .vt   { fill: #6E6E7A; font-size: 11.5px; }

    @keyframes entra {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .fila { opacity: 0; animation: entra 0.45s cubic-bezier(.22,1,.36,1) forwards; }
    .d1{animation-delay:.30s}  .d2{animation-delay:.39s}  .d3{animation-delay:.48s}
    .d4{animation-delay:.57s}  .d5{animation-delay:.66s}  .d6{animation-delay:.75s}
    .d7{animation-delay:.84s}  .d8{animation-delay:.93s}  .d9{animation-delay:1.02s}
    .d10{animation-delay:1.11s} .d11{animation-delay:1.20s} .d12{animation-delay:1.29s}
    .d13{animation-delay:1.38s}
  </style>

  <rect width="452" height="407" rx="14" fill="#08080A"/>
  <rect width="452" height="407" rx="14" fill="url(#brasa2)"/>
  <rect x="0.5" y="0.5" width="451" height="406" rx="14" fill="none" stroke="#1E1E23"/>

  <text x="24" y="32" class="t">juanes@github <tspan fill="#D6D6DE">~</tspan> $ neofetch</text>
  <line x1="24" y1="44" x2="428" y2="44" stroke="#1E1E23"/>

  <g class="fila d1">
    <text x="24" y="74" font-family="Georgia, serif" font-size="19" font-style="italic" fill="url(#oro2)">Juan Esteban Lizcano</text>
    <text x="24" y="92" class="t" letter-spacing="0.16em">BOGOTÁ · COLOMBIA</text>
  </g>

  <line x1="24" y1="108" x2="428" y2="108" stroke="#1E1E23"/>

  <g class="fila d2"><text x="24" y="132" class="k">Hago</text>      <text x="118" y="132" class="v">Páginas web y software a la medida</text></g>
  <g class="fila d3"><text x="24" y="153" class="k">Todo</text><text x="118" y="153" class="v">La idea, el diseño, el código, el deploy</text></g>
  <g class="fila d4">                                                 <text x="118" y="174" class="vt">y el soporte cuando algo se rompe</text></g>

  <line x1="24" y1="192" x2="428" y2="192" stroke="#1E1E23"/>

  <g class="fila d5"><text x="24" y="216" class="k">Frontend</text><text x="118" y="216" class="v">React · Next · Tailwind · Motion</text></g>
  <g class="fila d6"><text x="24" y="237" class="k">Backend</text> <text x="118" y="237" class="v">Supabase · Postgres · Node · Deno</text></g>
  <g class="fila d7"><text x="24" y="258" class="k">También</text> <text x="118" y="258" class="v">PWA · offline · pagos · IA</text></g>
  <g class="fila d8"><text x="24" y="279" class="k">Deploy</text>  <text x="118" y="279" class="v">Vercel · dominios · correo</text></g>

  <line x1="24" y1="297" x2="428" y2="297" stroke="#1E1E23"/>

  <g class="fila d9">
    <text x="24" y="321" class="k">Proyecto</text>
    <text x="118" y="321" class="v"><tspan font-family="Georgia, serif" font-style="italic" font-size="14" fill="#D6D6DE">mezo</tspan> — un POS para</text>
  </g>
  <g class="fila d10"><text x="118" y="339" class="v">cafeterías y restaurantes</text></g>
  <g class="fila d11"><text x="118" y="357" class="vt">en producción, cobrando a diario</text></g>

  <g class="fila d12"><text x="24" y="384" class="k">Título</text><text x="118" y="384" class="vt">ninguno — aprendido construyendo</text></g>
</svg>
